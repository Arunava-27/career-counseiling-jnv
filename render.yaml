services:
  - type: web
    name: career-counseling
    runtime: node
    plan: free
    # --include=dev is required here: Render sets NODE_ENV=production during the build
    # step too (not just at runtime), and npm skips devDependencies (vite, typescript,
    # tsx, etc.) by default in that mode — without this flag the build fails with
    # "Cannot find module 'vite'".
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_USERS
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
