<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Universe — Career Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F2EBDE;--off:#FBF7F0;--olive:#2F3A2A;--olive2:#4A5942;--sage:#9FB08C;--burnt:#D2622A;--terra:#B34A32;--char:#1C1A17;
--serif:'Caprasimo',Georgia,'Iowan Old Style','Times New Roman',serif;--sans:'Figtree','Segoe UI',system-ui,sans-serif}
html,body{height:100%;background:var(--char);overflow:hidden;font-family:var(--sans);-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;background:var(--cream);color:var(--olive);padding:56px 80px 48px;display:flex;flex-direction:column;overflow:hidden}
.kicker{font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--burnt);font-weight:700}
h1{font-family:var(--serif);font-weight:400;font-size:100px;line-height:.98;letter-spacing:-.005em;color:var(--olive)}
h2{font-family:var(--serif);font-weight:400;font-size:56px;line-height:1.04}
h3{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--burnt)}
p{font-size:30px;line-height:1.4;text-wrap:pretty}
.bar{margin-top:auto;display:flex;gap:18px;align-items:center;padding-top:26px}
.btn{font-family:var(--sans);font-size:24px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:22px 38px;min-height:74px;border:3px solid var(--olive);border-radius:10px;background:transparent;color:var(--olive);cursor:pointer;transition:background .18s,color .18s,transform .1s,opacity .2s}
.btn:hover{background:rgba(47,58,42,.08)}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--burnt);border-color:var(--burnt);color:var(--off)}
.btn.primary:hover{background:var(--terra);border-color:var(--terra)}
.btn.ghost{border-color:rgba(47,58,42,.32);color:var(--olive2)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn:focus-visible{outline:4px solid var(--terra);outline-offset:4px}
.spacer{flex:1}
.fade{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
.fade.in{opacity:1;transform:none}
::selection{background:rgba(210,98,42,.25)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.uni{position:relative;flex:1;margin-top:20px}
.map{position:absolute;inset:0;transition:opacity .45s ease,transform .45s ease}
.map.hide{opacity:0;transform:scale(.96);pointer-events:none}
.mapsvg{width:100%;height:100%}
.cl{cursor:pointer}
.cl rect{fill:var(--off);stroke:var(--olive);stroke-width:3;transition:fill .2s}
.cl:hover rect,.cl:focus rect{fill:var(--sage)}
.cl text{text-anchor:middle;font-family:var(--sans);font-size:25px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;fill:var(--olive);pointer-events:none}
.spoke{stroke:var(--sage);stroke-width:3}
.core circle{fill:var(--olive)}
.core text{text-anchor:middle;fill:var(--cream);font-family:var(--serif);font-size:34px}
.detail{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease;display:grid;grid-template-columns:620px 1fr;gap:64px;align-items:start}
.detail.show{opacity:1;pointer-events:auto}
.dtitle{font-family:var(--serif);font-size:78px;line-height:1;color:var(--terra)}
.dnote{font-size:28px;color:var(--olive2);margin-top:24px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.ccard{background:var(--off);border:3px solid var(--olive);border-radius:14px;padding:30px 26px;font-size:29px;font-weight:600;line-height:1.2;min-height:150px;display:flex;align-items:flex-end;opacity:0;transform:translateY(20px) scale(.97);transition:opacity .4s,transform .4s}
.ccard.in{opacity:1;transform:none}
.ov{position:absolute;inset:0;background:rgba(28,26,23,.86);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
.ov.show{opacity:1;pointer-events:auto}
.ovcard{background:var(--cream);border-radius:20px;padding:64px 72px;width:1180px}
.ovk{font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--burnt);font-weight:700}
.ovt{font-family:var(--serif);font-size:88px;line-height:1;margin:18px 0 30px}
.ovq{font-size:38px;color:var(--olive2)}
.ova{font-size:34px;line-height:1.35;margin-top:26px;border-top:3px solid var(--sage);padding-top:26px;opacity:0;transition:opacity .4s}
.ova.in{opacity:1}
.ovbar{display:flex;gap:18px;margin-top:36px}

</style></head>
<body><div id="stage">
<div class="kicker">Career Lab &middot; Visual 03</div>
<h1>Career Universe</h1>
<div class="uni">
  <div class="map" id="map"><svg class="mapsvg" viewBox="0 0 1760 760" id="mapsvg"></svg></div>
  <div class="detail" id="detail">
    <div><div class="kicker">Cluster</div><div class="dtitle" id="dtitle"></div><div class="dnote">Six examples. Every cluster holds far more work than fits on one screen.</div></div>
    <div class="grid" id="dgrid"></div>
  </div>
</div>
<div class="bar"><button class="btn ghost" id="back">Back to map</button><button class="btn primary" id="surprise">Find a surprising career</button><div class="spacer"></div><button class="btn ghost" id="reset">Reset</button></div>
<div class="ov" id="ov"><div class="ovcard">
  <div class="ovk">A less obvious career</div>
  <div class="ovt" id="ovt"></div>
  <div class="ovq">What problem does this person help solve?</div>
  <div class="ova" id="ova"></div>
  <div class="ovbar"><button class="btn primary" id="ovreveal">Reveal</button><button class="btn ghost" id="ovclose">Close</button></div>
</div></div>
</div>
<script>
(function(){function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();})();

var CL=[
 ['Health & Care',['Doctor','Nurse','Physiotherapist','Veterinarian','Medical Laboratory Scientist','Public Health Professional']],
 ['Building & Making',['Civil Engineer','Architect','Electrician','Mechanical Engineer','Railway Technician','Welder']],
 ['Design & Arts',['Animator','Graphic Designer','Architect','Textile Designer','Photographer','Game Designer']],
 ['Teaching & Research',['Teacher','Scientist','Historian','Researcher','Museum Curator','Archivist']],
 ['Business & Money',['Accountant','Banker','Entrepreneur','Economist','Financial Analyst','Logistics Planner']],
 ['Public Service',['Civil Servant','Police Officer','Armed Forces Officer','Judge','Policy Researcher','Emergency Management Professional']],
 ['Land & Environment',['Agricultural Scientist','Forester','Fisheries Scientist','Environmental Scientist','Climate Scientist','Water Resource Specialist']],
 ['Sport & Fitness',['Coach','Athlete','Sports Scientist','Sports Physiotherapist','Umpire','Fitness Trainer']]
];
var SURPRISE=[
 ['Geospatial Analyst','Turns maps and satellite data into decisions about land, disasters and infrastructure.'],
 ['Food Technologist','Keeps food safe and nutritious while it travels long distances to reach people.'],
 ['Forensic Scientist','Examines physical evidence so investigations rest on findings rather than guesses.'],
 ['Conservation Scientist','Helps forests, wildlife and habitats survive alongside human use of land.'],
 ['UX Researcher','Finds out where people struggle with a product before it is built for millions.'],
 ['Sports Scientist','Uses measurement of the body to improve performance and reduce injury.'],
 ['Renewable Energy Technician','Installs and maintains the equipment that turns sunlight and wind into electricity.'],
 ['Museum Conservator','Slows the decay of objects so future generations can still study them.']
];
var svg=document.getElementById('mapsvg'),NS='http://www.w3.org/2000/svg',cx=880,cy=378,R=290;
function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
CL.forEach(function(c,i){
  var ang=(-90+i*45)*Math.PI/180,x=cx+Math.cos(ang)*R*1.9,y=cy+Math.sin(ang)*R;
  var l=mk('line',{x1:cx,y1:cy,x2:x,y2:y,'class':'spoke'});svg.appendChild(l);
  var g=mk('g',{'class':'cl',transform:'translate('+x+','+y+')',tabindex:'0',role:'button'});
  g.appendChild(mk('rect',{x:-190,y:-46,width:380,height:92,rx:12}));
  var t=mk('text',{y:10});t.textContent=c[0].toUpperCase();g.appendChild(t);
  g.addEventListener('click',function(){open(i);});
  g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i);}});
  svg.appendChild(g);
});
var core=mk('g',{'class':'core'});core.appendChild(mk('circle',{cx:cx,cy:cy,r:130}));
['The world','of work'].forEach(function(s,i){var t=mk('text',{x:cx,y:cy-6+i*44});t.textContent=s;core.appendChild(t);});
svg.appendChild(core);
var timers=[];
function open(i){
  timers.forEach(clearTimeout);timers=[];
  document.getElementById('dtitle').textContent=CL[i][0];
  var g=document.getElementById('dgrid');
  g.innerHTML=CL[i][1].map(function(n){return '<div class="ccard">'+n+'</div>';}).join('');
  document.getElementById('back').disabled=false;
  document.getElementById('map').classList.add('hide');
  document.getElementById('detail').classList.add('show');
  g.querySelectorAll('.ccard').forEach(function(c,k){timers.push(setTimeout(function(){c.classList.add('in');},k*90));});
}
function closeD(){document.getElementById('back').disabled=true;document.getElementById('map').classList.remove('hide');document.getElementById('detail').classList.remove('show');}
document.getElementById('back').addEventListener('click',closeD);document.getElementById('back').disabled=true;
var ov=document.getElementById('ov');
document.getElementById('surprise').addEventListener('click',function(){
  var s=SURPRISE[Math.floor(Math.random()*SURPRISE.length)];
  document.getElementById('ovt').textContent=s[0];
  var a=document.getElementById('ova');a.textContent=s[1];a.classList.remove('in');
  ov.classList.add('show');
});
document.getElementById('ovreveal').addEventListener('click',function(){document.getElementById('ova').classList.add('in');});
document.getElementById('ovclose').addEventListener('click',function(){ov.classList.remove('show');});
document.getElementById('reset').addEventListener('click',function(){closeD();ov.classList.remove('show');});
</script></body></html>
