<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What Made This? — Career Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#F2EBDE;--off:#FBF7F0;--olive:#2F3A2A;--olive2:#4A5942;--sage:#9FB08C;--burnt:#D2622A;--terra:#B34A32;--char:#1C1A17;
--serif:'Caprasimo',Georgia,'Iowan Old Style','Times New Roman',serif;--sans:'Figtree','Segoe UI',system-ui,sans-serif}
html,body{height:100%;background:var(--char);overflow:hidden;font-family:var(--sans);-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;background:var(--cream);color:var(--olive);padding:56px 80px 48px;display:flex;flex-direction:column;overflow:hidden}
.kicker{font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--burnt);font-weight:700}
h1{font-family:var(--serif);font-weight:400;font-size:100px;line-height:.98;letter-spacing:-.005em;color:var(--olive)}
h2{font-family:var(--serif);font-weight:400;font-size:56px;line-height:1.04}
h3{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--burnt)}
p{font-size:30px;line-height:1.4;text-wrap:pretty}
.bar{margin-top:auto;display:flex;gap:18px;align-items:center;padding-top:26px}
.btn{font-family:var(--sans);font-size:24px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:22px 38px;min-height:74px;border:3px solid var(--olive);border-radius:10px;background:transparent;color:var(--olive);cursor:pointer;transition:background .18s,color .18s,transform .1s,opacity .2s}
.btn:hover{background:rgba(47,58,42,.08)}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--burnt);border-color:var(--burnt);color:var(--off)}
.btn.primary:hover{background:var(--terra);border-color:var(--terra)}
.btn.ghost{border-color:rgba(47,58,42,.32);color:var(--olive2)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn:focus-visible{outline:4px solid var(--terra);outline-offset:4px}
.spacer{flex:1}
.fade{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
.fade.in{opacity:1;transform:none}
::selection{background:rgba(210,98,42,.25)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.wrap{flex:1;display:grid;grid-template-columns:1fr 420px 1fr;grid-template-rows:1fr 1fr;gap:26px 40px;margin-top:18px;position:relative}
.grp{background:var(--off);border:3px solid var(--olive);border-radius:16px;padding:24px 26px;opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s}
.grp.in{opacity:1;transform:none}
.gk{font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:var(--burnt);font-weight:800;margin-bottom:16px}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cbtn{font-size:23px;font-weight:600;text-align:left;line-height:1.15;padding:16px 18px;border:3px solid rgba(47,58,42,.3);border-radius:10px;background:transparent;color:var(--olive);cursor:pointer;font-family:var(--sans);transition:background .2s,border-color .2s}
.cbtn:hover{background:var(--sage)}
.cbtn.sel{background:var(--olive);border-color:var(--olive);color:var(--off)}
.cbtn:focus-visible{outline:4px solid var(--terra);outline-offset:3px}
#g0{grid-area:1/1}#g1{grid-area:1/3}#g2{grid-area:2/1}#g3{grid-area:2/3}
.phonewrap{grid-area:1/2/span 2/3;display:flex;align-items:center;justify-content:center}
.phone{width:360px;height:660px;border:10px solid var(--olive);border-radius:46px;background:var(--olive);padding:14px;display:flex}
.screen{flex:1;background:var(--cream);border-radius:32px;padding:34px 30px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.sk{font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--burnt);font-weight:800}
.st{font-family:var(--serif);font-size:38px;line-height:1.05}
.sb{font-size:23px;line-height:1.35;color:var(--olive2)}
.ovl{position:absolute;inset:0;background:var(--cream);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.ovl.on{display:flex}
.chain{font-family:var(--serif);font-size:62px;text-align:center;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.chain.in{opacity:1;transform:none}
.arw{font-size:46px;color:var(--burnt);opacity:0;transition:opacity .4s}
.arw.in{opacity:1}
.fq{font-family:var(--serif);font-size:64px;text-align:center;max-width:1400px;line-height:1.08}
.sugg{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:1400px;margin-top:14px}
.sg{font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:3px solid var(--olive);border-radius:999px;padding:16px 32px;background:var(--off);opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}
.sg.in{opacity:1;transform:none}

</style></head>
<body><div id="stage">
<div class="kicker">Career Lab &middot; Visual 07</div>
<h1>What made this?</h1>
<div class="wrap" id="wrap">
  <div class="grp" id="g0"></div>
  <div class="phonewrap"><div class="phone"><div class="screen" id="screen"></div></div></div>
  <div class="grp" id="g1"></div>
  <div class="grp" id="g2"></div>
  <div class="grp" id="g3"></div>
  <div class="ovl" id="chainv">
    <div class="chain" id="c1">One object</div><div class="arw" id="a1">&darr;</div>
    <div class="chain" id="c2">Many specialists</div><div class="arw" id="a2">&darr;</div>
    <div class="chain" id="c3">One shared result</div>
  </div>
  <div class="ovl" id="finalv">
    <div class="fq">What else around you requires many different careers?</div>
    <div class="sugg" id="sugg"></div>
  </div>
</div>
<div class="bar"><button class="btn primary" id="go">Build the team</button><div class="spacer"></div><button class="btn ghost" id="reset">Reset</button></div>
</div>
<script>
(function(){function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();})();

var G=[
 ['Hardware',[['Electronics Engineer','Designs the circuits that make the device work.'],['Electrical Engineer','Works out how power moves through the device safely.'],['Materials Scientist','Chooses glass, metal and plastic that survive daily use.'],['Manufacturing Technician','Keeps the production line running accurately.']]],
 ['Software',[['Software Engineer','Writes the code that runs everything you touch.'],['UI/UX Designer','Decides how the screen should behave so people understand it.'],['Cybersecurity Engineer','Protects the data stored on the device.'],['Software Tester','Finds the faults before millions of people do.']]],
 ['Business',[['Product Manager','Decides what the product should do, and what it should not.'],['Marketing Specialist','Explains the product to the people it is meant for.'],['Financial Analyst','Works out what it costs to build and what it can be sold for.'],['Supply Chain Manager','Makes sure every part arrives at the right factory on time.']]],
 ['Real world',[['Factory Technician','Assembles and checks the device physically.'],['Logistics Professional','Moves the finished product across the country.'],['Retail Professional','Helps a customer choose and set it up.'],['Repair Technician','Keeps the device alive instead of replacing it.']]]
];
var timers=[],step=0;
function clearT(){timers.forEach(clearTimeout);timers=[];}
var screen=document.getElementById('screen');
function intro(){screen.innerHTML='<div class="sk">One smartphone</div><div class="st">How many different careers are hidden inside this one object?</div><div class="sb">Sixteen appear here. The real number is far larger.</div>';}
G.forEach(function(g,i){
  var el=document.getElementById('g'+i);
  el.innerHTML='<div class="gk">'+g[0]+'</div><div class="gl">'+g[1].map(function(c,k){return '<button class="cbtn" data-g="'+i+'" data-c="'+k+'">'+c[0]+'</button>';}).join('')+'</div>';
});
document.querySelectorAll('.cbtn').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('sel');});
  b.classList.add('sel');
  var c=G[+b.dataset.g][1][+b.dataset.c];
  screen.innerHTML='<div class="sk">'+G[+b.dataset.g][0]+'</div><div class="st">'+c[0]+'</div><div class="sb">'+c[1]+'</div>';
});});
var SUG=['School','Hospital','Railway','Satellite','Football match','Movie','Mobile app'];
document.getElementById('sugg').innerHTML=SUG.map(function(s){return '<div class="sg">'+s+'</div>';}).join('');
function apply(){
  clearT();
  if(step===0){document.querySelectorAll('.grp').forEach(function(g){g.classList.remove('in');});document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('sel');});intro();}
  document.getElementById('chainv').classList.toggle('on',step===2);
  document.getElementById('finalv').classList.toggle('on',step===3);
  if(step===2){['c1','a1','c2','a2','c3'].forEach(function(id,k){timers.push(setTimeout(function(){document.getElementById(id).classList.add('in');},k*450));});}
  else{['c1','a1','c2','a2','c3'].forEach(function(id){document.getElementById(id).classList.remove('in');});}
  if(step===3){document.querySelectorAll('.sg').forEach(function(s,k){timers.push(setTimeout(function(){s.classList.add('in');},k*110));});}
  else{document.querySelectorAll('.sg').forEach(function(s){s.classList.remove('in');});}
  var g=document.getElementById('go');
  g.textContent=step===0?'Build the team':(step===1?'One object, many specialists':(step===2?'Look around you':'Complete'));
  g.disabled=step>=3;
}
document.getElementById('go').addEventListener('click',function(){
  step++;apply();
  if(step===1){document.querySelectorAll('.grp').forEach(function(el,k){timers.push(setTimeout(function(){el.classList.add('in');},k*180));});}
});
document.getElementById('reset').addEventListener('click',function(){step=0;apply();});
apply();
</script></body></html>
